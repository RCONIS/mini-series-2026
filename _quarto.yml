project:
  type: website
  render:
    - index.qmd
    - listing.qmd
    - ATTRIBUTION.md
    - slides/01_packages.qmd
    - slides/02_workflow_tests.qmd
    - slides/03_tests_shiny.qmd
    - slides/04_optimization_ai.qmd
  pre-render:
    - python3 scripts/bundle-sessions.py
  output-dir: docs
  resources:
    - "slides/download/*.zip"
    - ATTRIBUTION.md

website:
  title: "GSWEP4R Mini-series"
  description: "`openstatsware` Workshop: Good Software Engineering Practice with R"
  site-url: https://RCONIS.github.io/mini-series-2026/
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Home
        icon: "house-fill"
      - href: listing.qmd
        text: Slides
        icon: "file-earmark-slides"
  page-footer:
    center:
      - text: "About `openstatsware`"
        href: https://openstatsware.org/
      - text: "About RCONIS"
        href: https://rconis.com/
      - text: "Source Code on GitHub"
        href: https://github.com/RCONIS/mini-series-2026

format:
  html:
    theme: lux
    css: styles.css
    toc: true
    link-external-icon: false
    link-external-newwindow: true

editor: source
